<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andromeda Ho!</title>
<meta name="description" content="Andromeda Ho! is a mobile space shooter by Gadolinium Games. Coming soon.">
<style>
  :root { --bg: #ffffff; --fg: #1b1d22; --muted: #5a606b; --accent: #0b6bcb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --fg: #e8eaee; --muted: #a2a8b3; --accent: #6cb4ff; }
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; text-align: center; }
  main { padding: 32px 16px; }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0; letter-spacing: 0.02em; }
  p { color: var(--muted); margin: 8px 0 0; }
  footer { margin-top: 48px; font-size: 0.9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Andromeda Ho!</h1>
  <p>A space shooter for Android by Gadolinium Games.</p>
  <p>Coming soon.</p>
  <footer><a href="/privacy/">Privacy Policy</a></footer>
</main>
</body>
</html>
